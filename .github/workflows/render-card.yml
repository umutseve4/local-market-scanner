name: render-card
on:
  push:
    paths:
      - 'assets/li_card.py'
      - '.github/workflows/render-card.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install matplotlib
      - name: Render card
        run: python assets/li_card.py assets/local-market-scanner-card.png
      - name: Commit rendered asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/local-market-scanner-card.png
          git commit -m "chore(assets): render LinkedIn card [skip ci]" || echo "no changes"
          git push
