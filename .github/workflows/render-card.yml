name: Render repository card

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/snapshots/latest.csv"
      - "data/snapshots/latest.json"
      - "scripts/render_repo_card.py"
      - ".github/workflows/render-card.yml"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: repository-card
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install visualization dependency
        run: python -m pip install "matplotlib>=3.8,<4"

      - name: Render card
        run: |
          python scripts/render_repo_card.py \
            --input-csv data/snapshots/latest.csv \
            --output images/market-pulse-card.png

      - name: Upload card artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-pulse-card
          path: images/market-pulse-card.png
          if-no-files-found: error

      - name: Commit card
        run: |
          if git diff --quiet -- images/market-pulse-card.png; then
            echo "No card changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/market-pulse-card.png
          git commit -m "chore(image): refresh repository card"
          git push
