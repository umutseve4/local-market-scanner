name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff coverage

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests with coverage
        env:
          PYTHONPATH: src
        run: |
          coverage run -m unittest discover -s tests
          coverage report --fail-under=80

      - name: Smoke test the CLI end to end
        env:
          PYTHONPATH: src
        run: |
          python -m lms.cli doctor --offline
          python -m lms.cli scan --fixture tests/fixtures/overpass_sample.json \
            --out /tmp/scan.csv
          python -m lms.cli leads --csv /tmp/scan.csv
          python -m lms.cli brief --csv /tmp/scan.csv --out /tmp/brief.md
          test -s /tmp/brief.md
