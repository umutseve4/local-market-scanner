name: scan

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "Bounding box 'south,west,north,east' (bos birak = Bursa varsayilani)"
        required: false
        default: ""
      max_score:
        description: "Lead esigi (bu skorun altindakiler lead sayilir)"
        required: true
        default: "25"
      limit:
        description: "Ozette gosterilecek lead sayisi"
        required: true
        default: "15"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e ".[export]"

      - name: Doctor
        run: lms doctor

      - name: Scan
        run: |
          BBOX_ARG=""
          if [ -n "${{ github.event.inputs.bbox }}" ]; then
            BBOX_ARG="--bbox ${{ github.event.inputs.bbox }}"
          fi
          lms scan $BBOX_ARG --out leads.csv --sqlite --track --db-path lms.db

      - name: Validate contract
        run: lms validate --csv leads.csv --report contract_report.md || true

      - name: Brief
        run: lms brief --csv leads.csv --out brief.md --max-score "${{ github.event.inputs.max_score }}"

      - name: Summary (top leads)
        run: |
          {
            echo "## Tarama ozeti (Bursa saglik sektoru)"
            echo '```'
            lms leads --csv leads.csv --max-score "${{ github.event.inputs.max_score }}" --limit "${{ github.event.inputs.limit }}"
            echo '```'
            echo ""
            echo "CSV satir sayisi: $(($(wc -l < leads.csv) - 1))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-results
          path: |
            leads.csv
            lms.db
            brief.md
            contract_report.md
          retention-days: 30
