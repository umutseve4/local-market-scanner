name: Mypy diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy pyarrow
      - name: Capture mypy output
        id: mypy
        continue-on-error: true
        run: mypy > /tmp/mypy.log 2>&1
      - name: Report diagnostics on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/mypy.log
      - name: Preserve failure status
        if: steps.mypy.outcome == 'failure'
        run: exit 1
