name: Render promo image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/render_promo_image.py"
      - ".github/workflows/promo-image.yml"

permissions:
  contents: write

concurrency:
  group: promo-image
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install image dependency
        run: python -m pip install "pillow>=10,<12"

      - name: Render promo image
        run: python scripts/render_promo_image.py

      - name: Upload promo artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-market-scanner-promo
          path: images/local-market-scanner-promo.png
          if-no-files-found: error

      - name: Commit promo image
        run: |
          if git diff --quiet -- images/local-market-scanner-promo.png; then
            echo "No promo image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/local-market-scanner-promo.png
          git commit -m "chore(image): refresh local-market-scanner promo"
          git push
