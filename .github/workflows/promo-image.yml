name: promo-image

on:
  push:
    branches: [main]
    paths:
      - "scripts/make_promo_image.py"
      - ".github/workflows/promo-image.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - run: python scripts/make_promo_image.py
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/promo_social.png
          git diff --cached --quiet && echo "no change" || git commit -m "chore: render social promo image [skip ci]"
          git push
